name: Testes N2 - Caradap.io
on:
  push:
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Executar JUnit + REST-assured
        working-directory: api
        run: mvn -B test
  expo-web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do app
        working-directory: mobile
        run: npm install
      - name: Iniciar API
        working-directory: api
        run: nohup mvn spring-boot:run > /tmp/caradap-api.log 2>&1 &
      - name: Iniciar Expo Web
        working-directory: mobile
        run: nohup npx expo start --web --port 8081 --non-interactive > /tmp/caradap-web.log 2>&1 &
        env:
          CI: '1'
      - name: Aguardar serviços
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health >/dev/null && curl -fsS http://localhost:8081/ >/dev/null; then exit 0; fi
            sleep 3
          done
          cat /tmp/caradap-api.log /tmp/caradap-web.log
          exit 1
      - name: Testes Selenium
        working-directory: api
        run: mvn -B test -Pe2e
