spring.application.name=caradap-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/caradap;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
app.jwt-secret=${JWT_SECRET:caradap-io-chave-local-altere-antes-de-publicar-2026}
app.admin-email=${ADMIN_EMAIL:admin@caradap.io}
app.admin-password=${ADMIN_PASSWORD:Admin@12345}
app.cors-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
server.error.include-message=always
